# STATUS: NOT INSTALLED -- parked on an unresolved HiDPI problem. Read this first.
#
# This works (theme + blur verified under QT_QPA_PLATFORM=wayland, 2026-08-24) but
# the greeter comes up oversized. eDP-1 is 2560x1600 on 290x180mm = 224 DPI, and
# Hyprland drives it at fractional scale 1.6 (logical 1600x1000). kwin's output
# auto-detect only picks integer scales, so it lands on 2 -> logical 1280x800 and
# a visibly too-large login screen.
#
# The only override is /var/lib/sddm/.config/kwinoutputconfig.json: owned by the
# sddm user, keyed on connector + EDID hash, rewritten by kwin, and undocumented
# for this use. Judged not worth 194 MB out of 15 GB on a machine that has never
# hit memory pressure. Kept here so the next attempt starts from these findings
# instead of repeating them.
#
# Run the SDDM greeter on Wayland instead of X11.
#
# Without this, sddm starts an Xorg server for the greeter and KEEPS IT ALIVE for
# the whole session -- ~194 MB resident on a Wayland desktop that never uses it.
# With DisplayServer=wayland, the greeter and its compositor both exit at login.
#
# The filename must sort AFTER caelestia.conf: sddm reads /etc/sddm.conf.d/*.conf
# in alphabetical order and later files win. caelestia.conf sets
# QT_QPA_PLATFORM=xcb, which would send the greeter looking for an X server that
# no longer exists, so GreeterEnvironment is re-declared here without it.
# QML_XHR_ALLOW_FILE_READ=1 is kept -- the theme needs it for the quotes widget.
#
# Upstream (github.com/ItsABigIgloo/caelestia-sddm) documents xcb only for
# `sddm-greeter --test-mode` blur. Verified 2026-08-24: blur renders correctly
# under QT_QPA_PLATFORM=wayland.
#
# CompositorCommand is NOT optional. sddm 0.21's built-in default is
# `weston --shell=kiosk` and weston is not installed on this machine; leaving it
# unset means no login screen at all. kwin_wayland is already present from the
# Plasma packages, so this adds no new dependency.

[General]
DisplayServer=wayland
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1

[Wayland]
CompositorCommand=kwin_wayland --no-lockscreen --no-global-shortcuts --locale1
