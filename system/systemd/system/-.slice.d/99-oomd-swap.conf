# systemd-oomd: swap-based backstop on the root slice.
#
# The man page recommends ManagedOOMSwap= on -.slice specifically, because it
# reads system-wide swap values and lets every descendant cgroup be a candidate.
# Fires only when swap use passes SwapUsedLimit (default 90%) -- with a 20G
# swapfile that is ~18G swapped, i.e. the machine is already unusable.
#
# Deliberately NOT setting ManagedOOMMemoryPressure= on user.slice or
# user@.service. Apps launched from Hyprland keybinds inherit the compositor's
# cgroup (session.slice/wayland-wm@hyprland.desktop.service, ~5G across 23 procs)
# instead of getting their own scope, so pressure-based killing would select that
# cgroup and SIGKILL the whole desktop. Fix the launcher first -- see
# packages/SYSTEM-NOTES.md -- then revisit.
[Slice]
ManagedOOMSwap=kill
