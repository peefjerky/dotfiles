# fnmode=2: the top row acts as F1-F12, hold fn for the media functions.
#
# swap_opt_cmd is deliberately NOT set. The default (0) is the mapping this
# machine wants: physical Command emits SUPER and physical Option emits ALT,
# which is what every keybind in config/caelestia/custom/keybinds.lua assumes
# ("Cmd" in those binds means SUPER, i.e. the physical Command key).
#
# swap_opt_cmd=1 moves SUPER one key left onto Option and pushes ALT onto
# Command -- the PC key ORDER (ctrl/super/alt), but not the labels. It was set
# here for a while and every SUPER bind silently landed on the wrong key.
#
# hid_apple loads from the initramfs on this box (apple_bce comes up at ~1.08s,
# just after "Run /init"), so this file must be baked in: run
# `sudo limine-mkinitcpio` after changing it, or the old value survives a reboot.
options hid_apple fnmode=2
