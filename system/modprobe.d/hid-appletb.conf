# hid-appletb-kbd dims the Touch Bar after dim_timeout then powers it off
# idle_timeout later. autodim=N disables that DRIVER-side timer.
#
# IMPORTANT: this does NOT stop the Touch Bar dimming. tiny-dfr runs its own
# idle timer and writes /sys/class/backlight/appletb_backlight/brightness
# directly, on constants hardcoded in its source with no config key. Verified:
# autodim reads N while tiny-dfr still drove the bar 1 -> 0 on idle.
#
# The flicker fix is packages/tiny-dfr-t2, which rebuilds tiny-dfr with
# DIMMED_BRIGHTNESS = 2. This line is kept so the two dimmers do not fight.
options hid_appletb_kbd autodim=N
