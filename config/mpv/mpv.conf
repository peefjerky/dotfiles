# ---- subtitles ----
sub-font=Satoshi Medium
sub-font-size=18
sub-color='#FFF2C200'
sub-outline-color='#FF000000'
sub-outline-size=2.2
sub-back-color='#00000000'    # kill the default translucent box; outline only
sub-shadow-offset=0
sub-margin-y=48

# Style embedded ASS subs too, instead of honouring their own fonts/colours.
sub-ass-override=yes

# ---- decoding ----
# Ice Lake Iris Plus G7: VA-API decodes H.264 and VP9 (all four profiles) but has
# no AV1 block, so 1080p VP9 is free on the GPU and AV1 would burn the CPU. yt-x
# already excludes av01 from its format selector for that reason.
# vaapi by name rather than auto-safe: auto-safe walks the backend list and this
# box has no Vulkan video decode queue and no libcuda, so it probes and fails both
# on every start ("Device does not support the VK_KHR_video_decode_queue
# extension", "CUDA: Cannot load libcuda.so.1") before landing on VA-API anyway.
# mpv still falls back to software for anything VA-API cannot decode, AV1 included.
hwdec=vaapi
