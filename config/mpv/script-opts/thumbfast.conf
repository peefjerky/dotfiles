# thumbfast -- seekbar thumbnail previews. uosc draws them; this generates them.
# thumbfast.lua itself is not tracked in the dotfiles repo, same as uosc: fetch it
# with
#   curl -fsSLo ~/.config/mpv/scripts/thumbfast.lua \
#     https://raw.githubusercontent.com/po5/thumbfast/master/thumbfast.lua
# uosc has no thumbnailer of its own, it just sends `script-message-to thumbfast
# thumb` on hover (uosc/elements/Timeline.lua:505) and reads back a `thumbfast-info`
# message (uosc/main.lua:1131). Without this script the seekbar has no preview.

# The one that actually matters for YouTube. thumbfast disables itself outright on
# any network source unless this is on (thumbfast.lua:406, demuxer-via-network).
# It does not re-run yt-dlp to do it: when the source is a ytdl stream it hands the
# worker the already-resolved stream-open-filename and spawns it with --ytdl=no
# (thumbfast.lua:452, :463), so there is one resolve per video, not two.
network=yes

# Spawn the worker at file load rather than on first hover, so the first scrub
# shows a picture instead of a gap. Costs one idle mpv process per playback.
spawn_first=yes

# Left off deliberately. thumbfast does not pass our hwdec through -- it hardcodes
# --hwdec=auto on the worker (thumbfast.lua:472), and auto on this box probes
# Vulkan and CUDA and fails both before reaching VA-API, once per spawn. The
# worker already runs --vd-lavc-fast --vd-lavc-skiploopfilter=all on two threads
# to make a 240px picture, so software decode is cheap enough not to buy that.
hwdec=no

# Default is 200. Slightly larger reads better on this display; both dimensions
# are a bounding box, aspect is preserved. Larger costs scaling time per thumb.
max_height=240
max_width=240
