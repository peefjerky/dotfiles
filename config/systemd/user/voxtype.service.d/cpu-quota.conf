[Service]
# Replaces ananicy's `"cgroup": "cpu80"`.
#
# ananicy enforces a quota by MOVING the process into /cpu80, which takes it out
# of this unit's cgroup -- /proc/PID/cgroup becomes "0::/cpu80". Systemd then
# permanently stops accounting for the service (CPUUsageNSec freezes) and its
# cgroup-based lifecycle management no longer covers the main process. The `cpu`
# controller is delegated to user@1000, so systemd can enforce the same cap in
# place instead.
#
# UNIT MISMATCH, deliberate: systemd's CPUQuota is a percentage of ONE CPU,
# ananicy's CPUQuota is a percentage of ALL CPUs. ananicy's cpu80 resolved to
# cpu.max "640000 100000" = 6.4 of this machine's 8 logical CPUs, so the
# equivalent here is 640%, not 80%.
CPUQuota=640%
