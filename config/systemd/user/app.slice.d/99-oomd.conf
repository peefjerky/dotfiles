# Pressure-based OOM killing, scoped to app.slice only.
#
# Safe here and nowhere else in the user session: every app started from a
# keybind now gets its own scope under app.slice (hypr-vars.lua wraps them in
# `uwsm app --`), so oomd's candidate cgroups are individual apps. Setting this
# on user.slice or user@.service instead would make the compositor's cgroup --
# Hyprland plus every window it spawned -- the fattest candidate, and oomd
# SIGKILLs the whole selected cgroup.
#
# Limit left at the 60% default; lower it here if kills come too late.
[Slice]
ManagedOOMMemoryPressure=kill
