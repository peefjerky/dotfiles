# EasyEffects greys out its tray toggle when it wins the startup race.
#
# XDG autostart and the Wayland session start in the same second here: the
# generated app-...@autostart.service and caelestia's `qs` both came up at
# 15:52:25 on the boot this was diagnosed. Qt asks
# QSystemTrayIcon::isSystemTrayAvailable() once, at startup, and caches the
# answer for the process lifetime -- EasyEffects surfaces it as canUseSysTray.
# Lose the race and org.kde.StatusNotifierWatcher (owned by qs) has no owner
# yet, so the tray is "unavailable" for the whole session even though the shell
# comes up a moment later. Restarting the unit by hand fixes it, which is the
# tell: nothing is misconfigured, it is just a coin flip each boot.
#
# gdbus ships with glib2 and `wait` returns the instant the name has an owner
# -- ~4ms once the shell is up. The leading `-` means a session with no tray at
# all still starts EasyEffects normally, 60s later. 20s is NOT enough margin:
# qs only appears ~19s after the session units start on this machine.
[Service]
ExecStartPre=-/usr/bin/gdbus wait --session --timeout 60 org.kde.StatusNotifierWatcher
