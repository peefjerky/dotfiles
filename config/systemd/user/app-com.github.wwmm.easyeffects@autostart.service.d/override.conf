# EasyEffects in --service-mode does not survive PipeWire going away: it catches
# "PipeWire error: connection error" and aborts inside lsp-plugins-lv2 with
# SIGABRT (observed 2026-08-24 13:28, on a pipewire.service restart). Without a
# restart policy the EQ chain stays dead until relaunched by hand, which silently
# reverts the speakers to flat -- taking the compressor/EQ distortion fix with it.
#
# StartLimit is deliberately loose: if PipeWire is down for a while, a tight limit
# would burn through the retries and park the unit in failed state for good.
[Unit]
After=pipewire.service pipewire-pulse.service
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5
