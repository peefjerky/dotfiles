# linux-t2 7.1.5+ uses t2bce_audio (BCE staging driver) instead of HDA codec.
# BCE exposes no HDA mixer controls so ACP profile probing always fails — "Default"
# never appears. pro-audio bypasses ACP probing entirely and works with BCE.
# The old broken-pipe headphone crash was HDA-specific; not applicable here.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.product.name = "Apple Audio Device"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = false
        api.acp.auto-port = false
        device.profile = "pro-audio"
      }
    }
  }
]
