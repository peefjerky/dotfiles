# Set Bluetooth output nodes to use a larger quantum (~42ms instead of 10ms).
# Reduces BT pipeline wake-up frequency from 94/sec to ~23/sec, cutting CPU overhead.
# Uses monitor.bluez.rules (not monitor.alsa.rules — ALSA rules don't apply to BT nodes).
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        node.latency = "2048/48000"
      }
    }
  }
]
