# Optimized Bluetooth configuration for AirPods Pro
# WirePlumber 0.5 format

monitor.bluez.properties = {
  # Enable high-quality codecs
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true

  # Prioritize AAC and SBC-XQ for AirPods
  bluez5.codecs = [ aac sbc_xq sbc ]

  # Disable power saving to prevent choppy audio
  bluez5.disable-power-saving = true

  # Increase headset roles for better compatibility
  bluez5.headset-roles = [ hsp_hs hsp_ag hfp_hf hfp_ag ]
}

monitor.bluez.rules = [
  {
    matches = [
      {
        # Match all Bluetooth audio devices
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        # Prefer A2DP profiles over headset. hw-volume dropped — it forces
        # volume renegotiation on AirPods, which triggers the WirePlumber
        # link-teardown race ("item deactivated before format was set").
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]
