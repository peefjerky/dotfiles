background_opacity          0.6
cursor_trail                1
window_padding_width        25

# Source Code Pro, nerd-patched. The "Mono" variant keeps icons to one cell;
# kitty also carries its own bundled Symbols Nerd Font as a fallback either way.
font_family                 SauceCodePro Nerd Font Mono
# Pinned rather than `auto` because fontconfig resolves bold to the SemiBold
# face, whose PostScript name is not one of the four below -- so the features
# silently would not apply to bold text.
bold_font                   postscript_name=SauceCodeProNFM-Bold
italic_font                 postscript_name=SauceCodeProNFM-Italic
bold_italic_font            postscript_name=SauceCodeProNFM-BoldItalic

# No ligature features here on purpose: Source Code Pro ships no liga/calt/dlig
# (checked against its GSUB table), so +liga would be dead config.
# These are the real OpenType features it does have. Indexed by PostScript name,
# not family -- that is kitty's rule, see `fc-scan file.ttf`.
#   +zero  slashed zero
#   +ss04  tailed l, serifed i -- separates l / 1 / I
# Also there, more a matter of taste: +ss02 single-storey a, +ss03 alt g,
# +ss06 alt $, +ss07 alt 1, +ss01 raised hyphen and asterisk.
font_features SauceCodeProNFM            +zero +ss04
font_features SauceCodeProNFM-Bold       +zero +ss04
font_features SauceCodeProNFM-Italic     +zero +ss04
font_features SauceCodeProNFM-BoldItalic +zero +ss04

include themes/noctalia.conf
