# Theming
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf
background_opacity 0.85

# Font
font_family      SauceCodePro Nerd Font Mono
bold_font        SauceCodePro Nerd Font Mono Bold
italic_font      SauceCodePro Nerd Font Mono Italic
bold_italic_font SauceCodePro Nerd Font Mono Bold Italic
font_size 11.0

# Ligatures
font_features SauceCodeProNFM +calt +liga +dlig
font_features SauceCodeProNFM-Bold +calt +liga +dlig
font_features SauceCodeProNFM-Italic +calt +liga +dlig
font_features SauceCodeProNFM-BoldItalic +calt +liga +dlig

# Cursor
cursor_shape beam
cursor_trail 1

# Layout / splits
window_margin_width 0
single_window_margin_width 10
window_padding_width 5
active_border_color #585b70
inactive_border_color #181825
inactive_text_alpha 0.6

# Splits: ctrl+\ = vertical, ctrl+- = horizontal, ctrl+w = close pane
map ctrl+\   launch --location=vsplit
map ctrl+-   launch --location=hsplit
map ctrl+w   close_window

# Navigate panes
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down

# Resize panes
map ctrl+shift+left  resize_window narrower 3
map ctrl+shift+right resize_window wider 3
map ctrl+shift+up    resize_window taller 3
map ctrl+shift+down  resize_window shorter 3

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
