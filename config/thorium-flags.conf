# Read by /usr/bin/thorium-browser, one flag per line, '#' comments allowed.
#
# Why: eDP-1 runs at 2560x1600 with scale 1.6 — a fractional scale. XWayland has
# no fractional-scale protocol support, so an X11 client renders at 1x and the
# compositor scales that buffer up by 1.6, which is exactly the soft, low-res
# look. Running natively on Wayland lets Thorium render at the real device pixel
# ratio instead of being upscaled.
--ozone-platform-hint=auto

# NOTE: --enable-features must appear EXACTLY ONCE. Chromium does not merge
# repeated occurrences of the flag; the last one on the command line wins and
# every earlier one is silently discarded. Keep additions comma-separated here.
#
# Verify any name you add is real before trusting it — Chromium silently ignores
# unknown features, so a typo or a renamed flag looks identical to a working one:
#   strings -a /opt/thorium-browser/thorium | grep -qxF <FeatureName> && echo ok
#
# This line previously read WaylandWindowDecorations,VaapiVideoDecodeLinuxGL.
# Neither name exists in M138 — decorations became default and decode was renamed
# to the Accelerated* form — so the whole line had been a no-op and there was no
# hardware decode at all.
#
#   AcceleratedVideoDecodeLinuxGL         - hardware video decode via VA-API.
#     Not default-on under Wayland until M143; Thorium is M138, so it is needed.
#   AcceleratedVideoDecodeLinuxZeroCopyGL - keep decoded frames in GPU memory
#     rather than copying them back out through the CPU.
#   AcceleratedVideoEncoder               - hardware video *encode*: the outgoing
#     camera stream in Meet/Jitsi. This is the one Firefox/Zen has never had
#     (bugzilla 969395, open since 2014), and the reason calls belong here.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder

# Driver is iHD (intel-media-driver), not the old i965 libva-intel-driver.
# Ice Lake Gen11 sits on the GPU blocklist for some accelerated paths.
--ignore-gpu-blocklist
